      70% { box-shadow: 0 0 0 11px rgba(117,247,177,0); }
      100% { box-shadow: 0 0 0 0 rgba(117,247,177,0); }
    }
    @keyframes textShine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes orbFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes load { to { width: 100%; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition: none !important;
      }
      .progress i { width: 100%; }
    }

    @media (max-width: 1020px) {
      .nav-links { display: none; }
    }

    @media (max-width: 680px) {
      .wrap { width: min(100% - 28px, 1160px); }
      .site-header { top: 10px; margin-top: 10px; }
      .nav { border-radius: 24px; }
      .brand span:last-child { display: none; }
      main { padding: 24px 0 38px; }
      .stage { width: calc(100% - 24px); }
      .quiz-panel { min-height: 460px; border-radius: 26px; }
      .terminal-bar { padding: 14px 18px; }
      .bar-tag { display: none; }
      .content { padding: 28px 22px 26px; }
      .heart-orb { width: 96px; height: 96px; margin-bottom: 20px; }
      .heart-glyph { font-size: 40px; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></canvas>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header wrap">
    <nav class="nav" aria-label="主要導覽">
      <a class="brand" href="/" aria-label="回到首頁">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>r0b5k3f0</span>
      </a>
      <div class="nav-links" aria-label="頁面區段">
        <a href="/">首頁</a>
        <a href="#quiz" aria-current="page">心動配對</a>
        <a href="/tools/python-lab/">Python Lab</a>
        <a href="/tools/jupyter/lab/">JupyterLite</a>
        <a href="/tools/pdf-toolbox/">PDF 工具箱</a>
        <a href="/tools/video-converter/">影片轉檔</a>
      </div>
      <a class="btn ghost" href="/">返回首頁</a>
    </nav>
  </header>

  <main id="quiz">
    <div class="stage">
      <div class="stage-head">
        <span class="status-pill">
          <span class="pulse-dot" aria-hidden="true"></span>
          Little Love Lab · 純前端零追蹤互動實驗
        </span>
      </div>

      <section class="quiz-panel" aria-label="心動配對實驗室">
        <div class="terminal-bar">
          <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
          <span id="barlabel" class="bar-label">一份關於相遇的小實驗</span>
          <span class="bar-tag">VOL.01</span>
        </div>
        <div id="screen" class="content" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="wrap">
    <div class="footer-inner">
      <div>© <span id="year"></span> r0b5k3f0 · 純屬娛樂，答案僅在本頁處理，不上傳、不儲存、不追蹤。</div>
      <div class="footer-links">
        <a href="/">Digital Garden</a>
        <a href="/#showcase">Showcase</a>
        <a href="https://github.com/r0b5k3f0" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
  </footer>

  <noscript>請開啟 JavaScript 以進行測驗。</noscript>
  <script src="config.js"></script>
  <script>
    (() => {
      'use strict';
      document.getElementById('year').textContent = new Date().getFullYear();

      const defaults = {
        name: 'r0b5k3f0',
        contactUrl: 'https://github.com/r0b5k3f0',
        contactLabel: '到 GitHub 跟我打個招呼',
        siteUrl: '/',
        siteLabel: '逛逛我的數位花園',
        bio: '嗨，我是 r0b5k3f0！\n喜歡把靈感寫成有趣的網頁實驗與工具，也熱愛探索新世界、研究遊戲機制與尋找隱藏彩蛋。\n很高興在這座數位花園的小宇宙遇見你，下一個存檔點一起走吧！',
        avatar: 'assets/avatar.svg',
        title: '心動配對實驗室',
        subtitle: '宇宙這麼大，或許答案就在眼前。'
      };
      const c = { ...defaults, ...window.QUIZ_CONFIG };
      const screen = document.getElementById('screen');
      const bar = document.getElementById('barlabel');
      let timer = null;
      document.title = c.name ? `${c.title} · ${c.name}` : c.title;

      const el = (tag, text, cls) => {
        const e = document.createElement(tag);
        if (text != null) e.textContent = text;
        if (cls) e.className = cls;
        return e;
      };
      const btn = (text, cls, fn) => {
        const b = el('button', text, cls);
        b.type = 'button';
        b.addEventListener('click', fn);
        return b;
      };
      function parseSafeSiteUrl(raw) {
        if (typeof raw !== 'string' || !raw.trim()) return null;
        const val = raw.trim();
        if (/^\/(?!\/)/.test(val)) return { href: val, external: false };
        try {
          const url = new URL(val);
          if (url.protocol === 'https:') return { href: url.href, external: true };
        } catch {}
        return null;
      }
      function show(label, nodes, focus = true) {
        clearTimeout(timer);
        bar.textContent = label;
        screen.replaceChildren(...nodes);
        if (focus) {
          const h = screen.querySelector('h1,h2');
          if (h) {
            h.tabIndex = -1;
            h.classList.add('focus-title');
            h.focus({ preventScroll: true });
          }
        }
      }
      const heart = () => {
        const orb = el('div', null, 'heart-orb');
        orb.setAttribute('aria-hidden', 'true');
        orb.append(el('span', '♥', 'heart-glyph'));
        return orb;
      };
      function home() {
        const pills = el('div', null, 'meta-pills');
        ['最多 2 個問題', '大約 15 秒', '零後端 · 零追蹤'].forEach((label) => {
          pills.append(el('span', label, 'meta-pill'));
        });
        show('一份關於相遇的小實驗', [
          el('p', 'A SMALL EXPERIMENT IN LOVE', 'eyebrow'),
          heart(),
          el('h1', c.title, 'gradient-text'),
          el('p', c.subtitle, 'desc'),
          btn('開始尋找  →', 'btn primary full', () => question(1)),
          pills
        ], false);
      }
      function question(n) {
        const selected = new Set();
        const next = btn('下一步  →', 'btn primary full', () => {
          if (!selected.size) return;
          if (n === 1) {
            if (selected.has(1)) question(2);
            else loading(false);
          } else {
            loading(selected.has(0));
          }
        });
        next.disabled = true;

        const choices = el('div', null, 'choices');
        const buttons = [];
        ['男性', '女性', '其他'].forEach((word, i) => {
          const b = btn('', 'choice', () => {
            if (n === 1) selected.clear();
            if (selected.has(i)) selected.delete(i);
            else selected.add(i);
            buttons.forEach((x, k) => {
              const on = selected.has(k);
              x.setAttribute('aria-pressed', String(on));
              x.lastChild.textContent = on ? '✓' : '';
            });
            next.disabled = selected.size === 0;
          });
          b.append(document.createTextNode(word), el('span', ''));
          b.lastChild.setAttribute('aria-hidden', 'true');
          b.setAttribute('aria-pressed', 'false');
          buttons.push(b);
          choices.append(b);
        });

        const steps = el('div', null, 'steps');
        steps.setAttribute('aria-hidden', 'true');
        steps.append(el('i', null, 'on'), el('i', null, n === 2 ? 'on' : ''));

        show('QUESTION 0' + n, [
          steps,
          el('p', n === 1 ? 'FIRST, A LITTLE ABOUT YOU' : 'FOLLOW YOUR HEART', 'eyebrow'),
          el('h2', n === 1 ? '你是？' : '你喜歡的對象是？'),
          el('p', n === 1 ? '選一個最適合你的答案。' : '可以複選，跟著直覺就好。', 'desc'),
          choices,
          next
        ]);
      }
      function loading(match) {
        const progress = el('div', null, 'progress');
        progress.append(el('i'));
        show('正在連接心動訊號', [
          el('p', 'CONNECTING THE DOTS', 'eyebrow'),
          heart(),
          el('h2', '收到你的心動訊號'),
          el('p', '讓宇宙稍微安排一下……', 'desc'),
          progress,
          el('p', '這是趣味動畫，不是真實的配對運算。', 'micro')
        ]);
        timer = setTimeout(() => result(match), 2800);
      }
      function result(match) {
        if (!match) {
          show('實驗結果 · 下一站幸福', [
            el('p', 'A DIFFERENT KIND OF DESTINY', 'eyebrow'),
            heart(),
            el('h2', '這次沒有配對成功'),
            el('p', '只是這個小測驗的設定不同，\n不是你的魅力不夠。\n屬於你的相遇，還在路上。', 'desc'),
            btn('再試一次  ↻', 'btn primary full', () => question(1)),
            el('p', '祝你在自己的宇宙裡，遇見喜歡的人。', 'micro')
          ]);
          return;
        }
        const pic = el('figure', null, 'portrait');
        const img = el('img');
        img.alt = c.name + '的頭像';
        img.src = c.avatar || defaults.avatar;
        img.addEventListener('error', () => {
          if (img.getAttribute('src') !== defaults.avatar) img.src = defaults.avatar;
        }, { once: true });
        pic.append(img, el('figcaption', 'YOUR LITTLE PLOT TWIST'), el('span', '♥', 'stamp'));

        const contact = btn(c.contactLabel + '  ↗', 'btn primary full', () => {
          let url;
          try { url = new URL(c.contactUrl); } catch {}
          if (!url || url.protocol !== 'https:') {
            let note = screen.querySelector('.note');
            if (!note) {
              note = el('p', '還沒設定聯絡連結喔！網站擁有者可以在 config.js 填入 HTTPS 網址。', 'note');
              contact.after(note);
            }
            return;
          }
          window.open(url.href, '_blank', 'noopener,noreferrer');
        });

        const subActions = el('div', null, 'sub-actions');
        const siteTarget = parseSafeSiteUrl(c.siteUrl);
        if (siteTarget && c.siteLabel) {
          const siteLink = el('a', c.siteLabel + ' →', 'secondary');
          siteLink.href = siteTarget.href;
          if (siteTarget.external) {
            siteLink.target = '_blank';
            siteLink.rel = 'noopener noreferrer';
          }
          subActions.append(siteLink);
        }
        subActions.append(btn('再測一次 ↻', 'secondary', () => question(1)));

        show('實驗結果 · 有人正在等你', [
          el('p', 'ONE VERY SPECIAL MATCH', 'eyebrow'),
          el('h2', '原來，你在這裡。', 'gradient-text'),
          pic,
          el('h2', c.name, 'name'),
          el('p', c.bio, 'desc'),
          el('div', '✦ 本次特別推薦 · 就是我 ✦', 'badge'),
          contact,
          subActions
        ]);
      }

      home();

      // Digital Garden ambient effects (cursor glow, panel spotlight, starfield)
      const cursor = document.querySelector('.cursor-glow');
      const panel = document.querySelector('.quiz-panel');
      window.addEventListener('pointermove', (event) => {
        cursor.style.opacity = '.85';
        cursor.style.left = event.clientX + 'px';
        cursor.style.top = event.clientY + 'px';
      }, { passive: true });
      window.addEventListener('pointerleave', () => {
        cursor.style.opacity = '0';
      });
      panel.addEventListener('pointermove', (event) => {
        const rect = panel.getBoundingClientRect();
        panel.style.setProperty('--mx', ((event.clientX - rect.left) / rect.width * 100).toFixed(2) + '%');
        panel.style.setProperty('--my', ((event.clientY - rect.top) / rect.height * 100).toFixed(2) + '%');
      }, { passive: true });

      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let stars = [];
      let width = 0;
      let height = 0;
      let dpr = 1;

      function resizeStars() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(160, Math.floor((width * height) / 8800));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          z: Math.random() * 0.8 + 0.2,
          r: Math.random() * 1.35 + 0.35,
          vx: (Math.random() - 0.5) * 0.08,
          vy: (Math.random() - 0.5) * 0.08,
          hue: [190, 230, 275, 320][Math.floor(Math.random() * 4)]
        }));
      }

      function drawStars() {
        ctx.clearRect(0, 0, width, height);
        for (const star of stars) {
          if (!prefersReducedMotion) {
            star.x += star.vx * star.z;
            star.y += star.vy * star.z;
            if (star.x < -10) star.x = width + 10;
            if (star.x > width + 10) star.x = -10;
            if (star.y < -10) star.y = height + 10;
            if (star.y > height + 10) star.y = -10;
          }
          const alpha = 0.22 + star.z * 0.55;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r * star.z, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${star.hue}, 100%, 78%, ${alpha})`;
          ctx.shadowBlur = 12 * star.z;
          ctx.shadowColor = `hsla(${star.hue}, 100%, 70%, .75)`;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        if (!prefersReducedMotion) requestAnimationFrame(drawStars);
      }

      window.addEventListener('resize', resizeStars, { passive: true });
      resizeStars();
      drawStars();
    })();
  </script>
</body>
</html>
