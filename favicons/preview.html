<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favicon Preview · r0b5k3f0</title>
  <style>
    :root { color-scheme: dark; --bg:#070812; --text:#f8fbff; --muted:rgba(248,251,255,.65); --cyan:#6ee7ff; --pink:#ff6ec7; --violet:#ba7cff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; color:var(--text); background:radial-gradient(circle at 20% 12%, rgba(110,231,255,.25), transparent 34%), radial-gradient(circle at 80% 80%, rgba(255,110,199,.2), transparent 36%), linear-gradient(135deg,#050611,#0b0d24 55%,#16091e); }
    .wrap { width:min(980px, calc(100% - 32px)); margin:0 auto; padding:56px 0; }
    h1 { margin:0 0 12px; font-size:clamp(34px, 7vw, 72px); line-height:.95; letter-spacing:-.06em; }
    p { color:var(--muted); line-height:1.7; margin:0 0 28px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:18px; }
    .card { border:1px solid rgba(255,255,255,.15); border-radius:28px; padding:24px; background:linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.045)); box-shadow:0 20px 70px rgba(0,0,0,.28); }
    .icon-row { display:flex; align-items:end; gap:18px; margin-bottom:18px; }
    .big { width:96px; height:96px; border-radius:24px; }
    .small { width:32px; height:32px; border-radius:8px; image-rendering:auto; }
    h2 { font-size:18px; margin:0 0 7px; }
    code { color:var(--cyan); font-size:13px; word-break:break-all; }
    a { color:var(--cyan); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Favicon SVG Preview</h1>
    <p>預設網站 favicon 使用 <code>/favicon.svg</code>；其他 SVG 可作為替代版本。</p>
    <section class="grid">
      <article class="card">
        <div class="icon-row"><img class="big" src="../favicon.svg" alt="Default Neon R"><img class="small" src="../favicon.svg" alt=""></div>
        <h2>Default Neon R</h2>
        <code>../favicon.svg</code>
      </article>
      <article class="card">
        <div class="icon-row"><img class="big" src="favicon-orb.svg" alt="Neon Orb"><img class="small" src="favicon-orb.svg" alt=""></div>
        <h2>Neon Orb</h2>
        <code>favicon-orb.svg</code>
      </article>
      <article class="card">
        <div class="icon-row"><img class="big" src="favicon-diamond.svg" alt="Aurora Diamond"><img class="small" src="favicon-diamond.svg" alt=""></div>
        <h2>Aurora Diamond</h2>
        <code>favicon-diamond.svg</code>
      </article>
      <article class="card">
        <div class="icon-row"><img class="big" src="favicon-circuit-r.svg" alt="Circuit R"><img class="small" src="favicon-circuit-r.svg" alt=""></div>
        <h2>Circuit R</h2>
        <code>favicon-circuit-r.svg</code>
      </article>
      <article class="card">
        <div class="icon-row"><img class="big" src="favicon-terminal.svg" alt="Terminal"><img class="small" src="favicon-terminal.svg" alt=""></div>
        <h2>Terminal</h2>
        <code>favicon-terminal.svg</code>
      </article>
      <article class="card">
        <div class="icon-row"><img class="big" src="favicon-mask.svg" alt="Mask"><img class="small" src="favicon-mask.svg" alt=""></div>
        <h2>Mask</h2>
        <code>favicon-mask.svg</code>
      </article>
    </section>
    <p style="margin-top:28px"><a href="/">返回首頁</a></p>
  </main>
</body>
</html>
